<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SignBridge Dataset Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid #22344a;
}

header h1{
    margin:0;
}

header span{
    color:#35d6a0;
}

main{
    width:94%;
    max-width:900px;
    margin:auto;
    padding:20px 0 40px;
}

.camera{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    background:#000;
    border-radius:20px;
    overflow:hidden;
    border:2px solid #243b55;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

.cameraStatus{
    position:absolute;
    top:12px;
    left:12px;
    padding:9px 14px;
    background:#111d2c;
    border-radius:30px;
    font-size:13px;
}

.dot{
    display:inline-block;
    width:9px;
    height:9px;
    background:#ffb000;
    border-radius:50%;
    margin-right:6px;
}

.card{
    background:#0d1928;
    border:1px solid #22344a;
    border-radius:18px;
    padding:20px;
    margin-top:18px;
}

.current{
    text-align:center;
}

.currentLabel{
    color:#8da1b8;
    font-size:13px;
    text-transform:uppercase;
}

.currentLetter{
    font-size:70px;
    font-weight:900;
    color:#35d6a0;
    margin:10px;
}

.samples{
    font-size:18px;
}

.progress{
    width:100%;
    height:10px;
    background:#1c2b3d;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progressBar{
    height:100%;
    width:0%;
    background:#35d6a0;
    transition:.2s;
}

.letters{
    display:grid;
    grid-template-columns:
        repeat(7,1fr);
    gap:7px;
    margin-top:15px;
}

.letter{
    border:1px solid #2a4059;
    background:#142337;
    color:white;
    padding:12px 5px;
    border-radius:9px;
    font-weight:bold;
}

.letter.active{
    background:#35d6a0;
    color:#06130f;
}

button{
    border:0;
    padding:14px 18px;
    border-radius:11px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.primary{
    background:#35d6a0;
    color:#06130f;
}

.secondary{
    background:#18283b;
    color:white;
    border:1px solid #2b425d;
}

.danger{
    background:#e05252;
    color:white;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.status{
    color:#9eb0c5;
    margin-top:12px;
    line-height:1.5;
}

.special{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.datasetList{
    margin-top:15px;
    max-height:300px;
    overflow:auto;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #22344a;
}

.ok{
    color:#35d6a0;
}

.warning{
    color:#ffb000;
}

@media(max-width:600px){

    .letters{
        grid-template-columns:
            repeat(5,1fr);
    }

    .currentLetter{
        font-size:60px;
    }

}

</style>
</head>


<body>

<header>

<h1>Sign<span>Bridge</span></h1>

<p>ASL Dataset Builder</p>

</header>


<main>


<!-- CAMERA -->

<div class="camera">

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<div class="cameraStatus">

<span class="dot"
      id="cameraDot">
</span>

<span id="cameraStatus">
Camera stopped
</span>

</div>

</div>


<!-- CAMERA CONTROLS -->

<div class="controls">

<button
    class="primary"
    id="startCamera">

📷 Start Camera

</button>

<button
    class="secondary"
    id="stopCamera">

Stop Camera

</button>

</div>


<!-- CURRENT CLASS -->

<div class="card current">

<div class="currentLabel">

Current sign

</div>

<div
    class="currentLetter"
    id="currentLetter">

A

</div>

<div class="samples">

Samples:
<span id="sampleCount">
0
</span>

</div>

<div class="progress">

<div
    class="progressBar"
    id="progressBar">
</div>

</div>

</div>


<!-- LETTER SELECTION -->

<div class="card">

<h2>
Choose ASL letter
</h2>

<div
    class="letters"
    id="letters">
</div>

</div>


<!-- COLLECTION -->

<div class="card">

<h2>
Collect Dataset
</h2>

<p class="status">

اختر حرفًا، قم بإشارة الحرف أمام الكاميرا،
ثم اضغط على زر جمع البيانات.

الموقع سيجمع نقاط اليد تلقائيًا.

</p>


<button
    class="primary"
    id="collect">

● Start collecting

</button>


<div class="status"
     id="collectionStatus">

Ready.

</div>

</div>


<!-- SPECIAL -->

<div class="card">

<h2>
Special gestures
</h2>

<p class="status">

سنستخدم إشارتين خاصتين لاحقًا:

</p>

<div class="special">

<button
    class="secondary"
    data-special="END_WORD">

END WORD

</button>

<button
    class="secondary"
    data-special="END_SENTENCE">

END SENTENCE

</button>

</div>

</div>


<!-- DATASET -->

<div class="card">

<h2>
Dataset
</h2>

<div
    class="datasetList"
    id="datasetList">
</div>


<div class="controls">

<button
    class="primary"
    id="download">

⬇ Download Dataset

</button>

<button
    class="secondary"
    id="save">

Save on phone

</button>

<button
    class="danger"
    id="reset">

Reset Dataset

</button>

</div>

</div>


</main>


<script type="module">

/* =====================================================
   MEDIAPIPE
===================================================== */

import {
    FilesetResolver,
    HandLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";


/* =====================================================
   SETTINGS
===================================================== */

const WASM_PATH =
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm";

const MODEL_PATH =
"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("video");

const startButton =
document.getElementById("startCamera");

const stopButton =
document.getElementById("stopCamera");

const collectButton =
document.getElementById("collect");

const cameraStatus =
document.getElementById("cameraStatus");

const cameraDot =
document.getElementById("cameraDot");

const currentLetter =
document.getElementById("currentLetter");

const sampleCount =
document.getElementById("sampleCount");

const progressBar =
document.getElementById("progressBar");

const collectionStatus =
document.getElementById("collectionStatus");

const lettersContainer =
document.getElementById("letters");

const datasetList =
document.getElementById("datasetList");


/* =====================================================
   VARIABLES
===================================================== */

let handLandmarker = null;

let stream = null;

let running = false;

let collecting = false;

let selectedClass = "A";

let dataset =
JSON.parse(
localStorage.getItem(
"signbridge_dataset"
) || "{}"
);


/* =====================================================
   CREATE LETTER BUTTONS
===================================================== */

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

alphabet.forEach(letter => {

    const button =
    document.createElement("button");

    button.className =
    "letter";

    button.textContent =
    letter;

    button.onclick = () => {

        selectedClass = letter;

        currentLetter.textContent =
        letter;

        document
        .querySelectorAll(".letter")
        .forEach(b =>
            b.classList.remove("active")
        );

        button.classList.add("active");

        updateUI();

    };

    lettersContainer.appendChild(button);

});


document
.querySelector(".letter")
.classList.add("active");


/* =====================================================
   SPECIAL BUTTONS
===================================================== */

document
.querySelectorAll("[data-special]")
.forEach(button => {

    button.onclick = () => {

        selectedClass =
        button.dataset.special;

        currentLetter.textContent =
        selectedClass;

        document
        .querySelectorAll(".letter")
        .forEach(b =>
            b.classList.remove("active")
        );

        updateUI();

    };

});


/* =====================================================
   INITIALIZE MEDIAPIPE
===================================================== */

async function initialize(){

    collectionStatus.textContent =
    "Loading hand recognition...";

    try{

        const vision =
        await FilesetResolver
        .forVisionTasks(WASM_PATH);


        handLandmarker =
        await HandLandmarker
        .createFromOptions(
            vision,
            {

                baseOptions:{
                    modelAssetPath:
                    MODEL_PATH
                },

                runningMode:
                "VIDEO",

                numHands:1,

                minHandDetectionConfidence:
                0.5,

                minHandPresenceConfidence:
                0.5,

                minTrackingConfidence:
                0.5

            }
        );


        collectionStatus.textContent =
        "AI ready.";

    }

    catch(error){

        console.error(error);

        collectionStatus.textContent =
        "Error loading hand recognition.";

    }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    try{

        stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user",
                width:{
                    ideal:1280
                },
                height:{
                    ideal:720
                }
            },

            audio:false

        });


        video.srcObject =
        stream;

        await video.play();

        running = true;

        cameraStatus.textContent =
        "Camera running";

        cameraDot.style.background =
        "#35d6a0";


        processFrame();

    }

    catch(error){

        console.error(error);

        cameraStatus.textContent =
        "Camera permission denied";

        collectionStatus.textContent =
        "Autorisez la caméra dans Chrome.";

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    running = false;

    if(stream){

        stream
        .getTracks()
        .forEach(track =>
            track.stop()
        );

    }

    video.srcObject = null;

    cameraStatus.textContent =
    "Camera stopped";

    cameraDot.style.background =
    "#ffb000";

}


/* =====================================================
   NORMALIZE HAND
===================================================== */

function normalizeLandmarks(
    landmarks
){

    if(
        !landmarks ||
        landmarks.length !== 21
    ){

        return null;

    }


    const wrist =
    landmarks[0];


    const points =
    landmarks.map(point => [

        point.x - wrist.x,

        point.y - wrist.y,

        point.z - wrist.z

    ]);


    let scale = 0;


    points.forEach(point => {

        const distance =
        Math.sqrt(

            point[0] *
            point[0] +

            point[1] *
            point[1] +

            point[2] *
            point[2]

        );


        scale =
        Math.max(
            scale,
            distance
        );

    });


    if(scale === 0)
    return null;


    return points
    .flat()
    .map(
        value =>
        value / scale
    );

}


/* =====================================================
   CAMERA LOOP
===================================================== */

async function processFrame(){

    if(!running)
    return;


    if(
        handLandmarker &&
        video.readyState >= 2
    ){

        const result =
        handLandmarker
        .detectForVideo(
            video,
            performance.now()
        );


        if(
            result.landmarks &&
            result.landmarks.length > 0
        ){

            if(collecting){

                const vector =
                normalizeLandmarks(
                    result.landmarks[0]
                );


                if(vector){

                    if(
                        !dataset[selectedClass]
                    ){

                        dataset[selectedClass] =
                        [];

                    }


                    dataset[selectedClass]
                    .push(vector);


                    updateUI();

                }

            }

        }

    }


    requestAnimationFrame(
        processFrame
    );

}


/* =====================================================
   COLLECT DATA
===================================================== */

collectButton.onclick =
async () => {

    if(!running){

        collectionStatus.textContent =
        "شغّل الكاميرا أولاً.";

        return;

    }


    if(!handLandmarker){

        collectionStatus.textContent =
        "AI لم يتم تحميله بعد.";

        return;

    }


    if(collecting){

        collecting = false;

        collectButton.textContent =
        "● Start collecting";

        collectionStatus.textContent =
        "Collection stopped.";

        saveDataset();

        return;

    }


    if(!dataset[selectedClass]){

        dataset[selectedClass] =
        [];

    }


    collecting = true;

    collectButton.textContent =
    "■ Stop collecting";

    collectionStatus.textContent =
    "Hold the " +
    selectedClass +
    " sign...";


    setTimeout(() => {

        if(collecting){

            collecting = false;

            collectButton.textContent =
            "● Start collecting";

            collectionStatus.textContent =
            "Collection complete.";

            saveDataset();

        }

    },3000);

};


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

    const count =
    dataset[selectedClass]
    ?.length || 0;


    sampleCount.textContent =
    count;


    const percent =
    Math.min(
        100,
        count
        );

    progressBar.style.width =
    percent + "%";


    renderDataset();

}


/* =====================================================
   RENDER DATASET
===================================================== */

function renderDataset(){

    datasetList.innerHTML = "";


    const labels =
    Object.keys(dataset);


    if(labels.length === 0){

        datasetList.innerHTML =
        "<p class='status'>No data yet.</p>";

        return;

    }


    labels.forEach(label => {

        const row =
        document.createElement("div");

        row.className =
        "row";


        const name =
        document.createElement("span");

        name.textContent =
        label;


        const count =
        document.createElement("span");

        count.textContent =
        dataset[label].length +
        " samples";


        count.className =
        dataset[label].length >= 30
        ? "ok"
        : "warning";


        row.appendChild(name);

        row.appendChild(count);

        datasetList.appendChild(row);

    });

}


/* =====================================================
   SAVE
===================================================== */

function saveDataset(){

    localStorage.setItem(
        "signbridge_dataset",
        JSON.stringify(dataset)
    );

}


document
.getElementById("save")
.onclick = () => {

    saveDataset();

    collectionStatus.textContent =
    "Dataset saved on this phone.";

};


/* =====================================================
   DOWNLOAD JSON
===================================================== */

document
.getElementById("download")
.onclick = () => {

    const data =
    JSON.stringify(
        dataset,
        null,
        2
    );


    const blob =
    new Blob(
        [data],
        {
            type:
            "application/json"
        }
    );


    const url =
    URL.createObjectURL(
        blob
    );


    const link =
    document.createElement("a");


    link.href = url;

    link.download =
    "signbridge-asl-dataset.json";


    link.click();


    URL.revokeObjectURL(url);

};


/* =====================================================
   RESET
===================================================== */

document
.getElementById("reset")
.onclick = () => {

    if(
        !confirm(
            "Delete all dataset?"
        )
    )
    return;


    dataset = {};

    localStorage.removeItem(
        "signbridge_dataset"
    );

    updateUI();

    collectionStatus.textContent =
    "Dataset deleted.";

};


/* =====================================================
   BUTTON EVENTS
===================================================== */

startButton.onclick =
startCamera;

stopButton.onclick =
stopCamera;


/* =====================================================
   START AI
===================================================== */

initialize();

updateUI();

</script>

</body>
</html>
